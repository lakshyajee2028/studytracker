  <!-- Firebase SDKs -->
  <script type="module">
    // Import Firebase modules (modular SDK v9+)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-analytics.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged,
      signOut 
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc, 
      onSnapshot,
      updateDoc,
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    // Firebase Config (UPDATED with new credentials)
    const firebaseConfig = {
      apiKey: "AIzaSyCs5Tqjn0aoglz2Z5Yly0m3Fnnzp8azQro",
      authDomain: "studytracker-48bf3.firebaseapp.com",
      projectId: "studytracker-48bf3",
      storageBucket: "studytracker-48bf3.firebasestorage.app",
      messagingSenderId: "946551301446",
      appId: "1:946551301446:web:fe7e95bfa14bb0972b7147",
      measurementId: "G-JY1YZ6987P"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const db = getFirestore(app);

    // DOM elements
    const loginSection = document.getElementById('loginSection');
    const appSection = document.getElementById('appSection');
    const userInfo = document.getElementById('userInfo');
    const userName = document.getElementById('userName');
    const userEmail = document.getElementById('userEmail');
    const logoutBtn = document.getElementById('logoutBtn');

    // Login form elements
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');
    const googleBtn = document.getElementById('googleBtn');
    const guestBtn = document.getElementById('guestBtn');
    const authError = document.getElementById('authError');

    // ---------- UI helpers ----------
    function showApp() {
      loginSection.style.display = 'none';
      appSection.style.display = 'block';
    }

    function showLogin() {
      loginSection.style.display = 'flex';
      appSection.style.display = 'none';
    }

    function setError(msg) {
      authError.textContent = msg;
      authError.style.display = 'block';
      setTimeout(() => { authError.style.display = 'none'; }, 4000);
    }

    // ---------- Firestore sync (user data) ----------
    let currentUser = null;
    let unsubscribeFirestore = null;

    async function syncLocalWithFirestore(uid) {
      const userDocRef = doc(db, 'users', uid);
      const docSnap = await getDoc(userDocRef);
      
      let localData = {};
      try {
        localData = JSON.parse(localStorage.getItem('studyPulse')) || {};
      } catch(e) {}

      if (docSnap.exists()) {
        const remoteData = docSnap.data().studyPulse || {};
        const merged = { ...localData, ...remoteData };
        localStorage.setItem('studyPulse', JSON.stringify(merged));
        await setDoc(userDocRef, { 
          studyPulse: merged,
          lastSynced: serverTimestamp()
        }, { merge: true });
        window.location.reload();
      } else {
        await setDoc(userDocRef, { 
          studyPulse: localData,
          lastSynced: serverTimestamp()
        });
      }
    }

    function listenToFirestore(uid) {
      if (unsubscribeFirestore) unsubscribeFirestore();
      const userDocRef = doc(db, 'users', uid);
      unsubscribeFirestore = onSnapshot(userDocRef, (docSnap) => {
        if (docSnap.exists()) {
          const remoteData = docSnap.data().studyPulse || {};
          if (Object.keys(remoteData).length > 0) {
            localStorage.setItem('studyPulse', JSON.stringify(remoteData));
            if (document.getElementById('appSection').style.display !== 'none') {
              const currentLocal = JSON.parse(localStorage.getItem('studyPulse')) || {};
              if (JSON.stringify(currentLocal) !== JSON.stringify(remoteData)) {
                window.location.reload();
              }
            }
          }
        }
      });
    }

    async function pushToFirestore(uid) {
      if (!uid) return;
      const localData = JSON.parse(localStorage.getItem('studyPulse')) || {};
      const userDocRef = doc(db, 'users', uid);
      await setDoc(userDocRef, { 
        studyPulse: localData,
        lastSynced: serverTimestamp()
      }, { merge: true });
    }

    // ---------- Auth state handler ----------
    async function handleUser(user) {
      if (user) {
        currentUser = user;
        userName.textContent = user.displayName || user.email || 'User';
        userEmail.textContent = user.email || '';
        let uid = user.uid;
        if (user.isAnonymous) {
          let guestId = localStorage.getItem('guestId');
          if (!guestId) {
            guestId = 'guest_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            localStorage.setItem('guestId', guestId);
          }
          uid = guestId;
        }
        if (!user.isAnonymous) {
          await syncLocalWithFirestore(uid);
          listenToFirestore(uid);
          const originalPush = pushToFirestore;
          pushToFirestore = async function(uid) {
            if (!uid) return;
            const localData = JSON.parse(localStorage.getItem('studyPulse')) || {};
            const userDocRef = doc(db, 'users', uid);
            await setDoc(userDocRef, { 
              studyPulse: localData,
              lastSynced: serverTimestamp()
            }, { merge: true });
          };
        } else {
          pushToFirestore = async function(uid) {
            console.log('Guest mode: no cloud sync');
          };
        }
        showApp();
        if (typeof window.initApp === 'function') {
          window.initApp();
        }
      } else {
        currentUser = null;
        if (unsubscribeFirestore) unsubscribeFirestore();
        showLogin();
      }
    }

    onAuthStateChanged(auth, handleUser);

    // ---------- Login methods ----------
    googleBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        setError(error.message);
      }
    });

    loginBtn.addEventListener('click', async () => {
      const email = loginEmail.value.trim();
      const password = loginPassword.value.trim();
      if (!email || !password) {
        setError('Please fill email and password');
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        setError(error.message);
      }
    });

    registerBtn.addEventListener('click', async () => {
      const email = loginEmail.value.trim();
      const password = loginPassword.value.trim();
      if (!email || !password) {
        setError('Please fill email and password');
        return;
      }
      if (password.length < 6) {
        setError('Password must be at least 6 characters');
        return;
      }
      try {
        await createUserWithEmailAndPassword(auth, email, password);
      } catch (error) {
        setError(error.message);
      }
    });

    guestBtn.addEventListener('click', async () => {
      try {
        const guestUser = {
          uid: 'guest_' + localStorage.getItem('guestId') || 'guest_' + Date.now(),
          displayName: 'Guest',
          email: 'guest@local.dev',
          isAnonymous: true
        };
        localStorage.setItem('guestUser', JSON.stringify(guestUser));
        handleUser(guestUser);
      } catch (error) {
        setError(error.message);
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        if (currentUser && !currentUser.isAnonymous) {
          await pushToFirestore(currentUser.uid);
        }
        await signOut(auth);
        localStorage.removeItem('guestUser');
        showLogin();
      } catch (error) {
        setError(error.message);
      }
    });

    window.addEventListener('load', () => {
      const guest = localStorage.getItem('guestUser');
      if (guest) {
        try {
          const guestUser = JSON.parse(guest);
          handleUser(guestUser);
        } catch(e) {}
      }
    });

    window.pushToFirestore = pushToFirestore;
    window.getCurrentUser = () => currentUser;

    console.log('🔥 Firebase + Login ready (updated config)');
  </script>

  <script>
    // Inject the original app HTML
    const appHTML = `

    <!-- WhatsApp Modal -->
    <div class="modal" id="whatsappModal">
      <div class="modal-box">
        <h2>📤 Send Report</h2>
        <p>Enter Parent's WhatsApp Number</p>
        <div class="number-box">
          <div class="country-code">+91</div>
          <input type="tel" id="parentNumber" maxlength="10" placeholder="Enter 10 digit number" />
        </div>
        <div class="modal-actions">
          <button type="button" class="sendBtn" onclick="confirmSendReport()">🚀 Open WhatsApp</button>
          <button type="button" class="cancelBtn" onclick="closeModal()">❌ Cancel</button>
        </div>
      </div>
    </div>
    `;
    document.getElementById('appContent').innerHTML = appHTML;

    // ---- ORIGINAL APP SCRIPT (with firebase sync) ----
    // All functions from the original tracker, with saveData overridden to push to firestore
    
    // Data structure
    let studyData = JSON.parse(localStorage.getItem('studyPulse')) || {
      timeline: [],
      streak: 0,
      lastDate: '',
      sessions: [],
      monthly: {}
    };

    function saveData() {
      localStorage.setItem('studyPulse', JSON.stringify(studyData));
      // Push to firestore if user is logged in
      const user = window.getCurrentUser ? window.getCurrentUser() : null;
      if (user && !user.isAnonymous) {
        window.pushToFirestore && window.pushToFirestore(user.uid);
      }
      updateUI();
    }

    function updateUI() {
      const timeline = document.getElementById('timeline');
      if (timeline) {
        timeline.innerHTML = studyData.timeline.map(t => 
          `<div class="timeline-item"><span class="time">${t.time}</span><span class="event">${t.event}</span></div>`
        ).join('');
      }
      const streakBox = document.getElementById('streakBox');
      if (streakBox) {
        streakBox.textContent = `🔥 Study Streak: ${studyData.streak} Days`;
      }
      // Monthly reports
      const monthlyDiv = document.getElementById('monthlyReports');
      if (monthlyDiv) {
        const months = Object.keys(studyData.monthly || {}).sort();
        monthlyDiv.innerHTML = months.map(m => {
          const data = studyData.monthly[m];
          return `<div class="report-item"><span>${m}</span><span>📖 ${data.study || 0}h | 🏫 ${data.coaching || 0}h</span></div>`;
        }).join('');
      }
      // Update report section
      const reportSection = document.getElementById('reportSection');
      if (reportSection) {
        const totalStudy = studyData.timeline.filter(t => t.event.includes('Study')).length;
        const totalCoaching = studyData.timeline.filter(t => t.event.includes('Coaching')).length;
        reportSection.innerHTML = `
          <h2>📊 Today's Summary</h2>
          <p>📖 Study Sessions: ${totalStudy} | 🏫 Coaching: ${totalCoaching}</p>
          <button onclick="generateReport()" style="padding:10px 24px;border:none;border-radius:40px;background:linear-gradient(135deg,#2563eb,#06b6d4);color:white;font-weight:600;cursor:pointer;margin-top:12px;">📈 Generate Report</button>
          <button onclick="openModal()" style="padding:10px 24px;border:none;border-radius:40px;background:linear-gradient(135deg,#25d366,#128C7E);color:white;font-weight:600;cursor:pointer;margin-top:12px;margin-left:10px;"><i class="fab fa-whatsapp"></i> Share Report</button>
        `;
      }
    }

    // Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toLocaleTimeString('en-IN', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Check streak
    function checkStreak() {
      const today = new Date().toDateString();
      if (studyData.lastDate !== today) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        if (studyData.lastDate === yesterday.toDateString()) {
          // continued
        } else {
          studyData.streak = 0;
        }
        studyData.lastDate = today;
        saveData();
      }
    }
    checkStreak();

    // Actions
    function addEvent(event) {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      studyData.timeline.push({ time: timeStr, event });
      // update monthly
      const monthKey = now.toLocaleString('en-IN', { month: 'short', year: 'numeric' });
      if (!studyData.monthly[monthKey]) studyData.monthly[monthKey] = { study: 0, coaching: 0 };
      if (event.includes('Study')) studyData.monthly[monthKey].study = (studyData.monthly[monthKey].study || 0) + 1;
      if (event.includes('Coaching')) studyData.monthly[monthKey].coaching = (studyData.monthly[monthKey].coaching || 0) + 1;
      // streak
      const today = new Date().toDateString();
      if (studyData.lastDate !== today) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        if (studyData.lastDate === yesterday.toDateString() || studyData.lastDate === '') {
          studyData.streak += 1;
        } else {
          studyData.streak = 1;
        }
        studyData.lastDate = today;
      }
      saveData();
    }

    function wakeUp() { addEvent('🌅 Wake Up'); }
    function coachingStart() { addEvent('🏫 Coaching Start'); }
    function coachingEnd() { addEvent('🏠 Coaching End'); }
    function startStudy() { addEvent('📖 Study Start'); }
    function stopStudy() { addEvent('⏹ Study Stop'); }
    function sleepNow() { addEvent('🌙 Sleep'); }

    // Report generation (placeholder)
    function generateReport() {
      alert('Report generated! (Check console)');
      console.log('Study Data:', studyData);
    }

    // WhatsApp modal
    function openModal() {
      document.getElementById('whatsappModal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('whatsappModal').style.display = 'none';
    }
    function confirmSendReport() {
      const number = document.getElementById('parentNumber').value.trim();
      if (number.length === 10) {
        const msg = `📊 Study Report:\nTotal Study: ${studyData.timeline.filter(t => t.event.includes('Study')).length} sessions\nTotal Coaching: ${studyData.timeline.filter(t => t.event.includes('Coaching')).length} sessions\nStreak: ${studyData.streak} days`;
        window.open(`https://wa.me/91${number}?text=${encodeURIComponent(msg)}`, '_blank');
        closeModal();
      } else {
        alert('Please enter a valid 10-digit number.');
      }
    }

    // Expose to global
    window.wakeUp = wakeUp;
    window.coachingStart = coachingStart;
    window.coachingEnd = coachingEnd;
    window.startStudy = startStudy;
    window.stopStudy = stopStudy;
    window.sleepNow = sleepNow;
    window.generateReport = generateReport;
    window.openModal = openModal;
    window.closeModal = closeModal;
    window.confirmSendReport = confirmSendReport;
    window.initApp = function() {
      updateUI();
      checkStreak();
    };

    // Init
    updateUI();
    checkStreak();
  </script>
</body>
</html>
