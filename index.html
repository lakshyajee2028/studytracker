    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    const db = getFirestore(app);

    // DOM elements

    const appSection = document.getElementById('appSection');
    const userInfo = document.getElementById('userInfo');
    const userName = document.getElementById('userName');
    const userEmail = document.getElementById('userEmail');
    const logoutBtn = document.getElementById('logoutBtn');

    // Login form elements
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');
    const googleBtn = document.getElementById('googleBtn');
    const guestBtn = document.getElementById('guestBtn');
    const authError = document.getElementById('authError');

    // ---------- UI helpers ----------
    function showApp() {
      loginSection.style.display = 'none';
      appSection.style.display = 'block';
    }

    function showLogin() {
      loginSection.style.display = 'flex';
      appSection.style.display = 'none';
    }

    function setError(msg) {
      authError.textContent = msg;
      authError.style.display = 'block';
      setTimeout(() => { authError.style.display = 'none'; }, 4000);
    }

    // ---------- Firestore sync (user data) ----------
    // We'll store the entire tracker data under user's UID
    // and keep it in sync with localStorage for offline/performance
    let currentUser = null;
    let unsubscribeFirestore = null;

    // Merge local data with firestore
    async function syncLocalWithFirestore(uid) {
      const userDocRef = doc(db, 'users', uid);
      const docSnap = await getDoc(userDocRef);
      
      // Get local data
      let localData = {};
      try {
        localData = JSON.parse(localStorage.getItem('studyPulse')) || {};
      } catch(e) {}

      if (docSnap.exists()) {
        const remoteData = docSnap.data().studyPulse || {};
        // Merge: remote takes precedence, but keep local if remote is empty
        const merged = { ...localData, ...remoteData };
        // Save merged to local
        localStorage.setItem('studyPulse', JSON.stringify(merged));
        // Also update firestore with merged (in case local has new data)
        await setDoc(userDocRef, { 
          studyPulse: merged,
          lastSynced: serverTimestamp()
        }, { merge: true });
        // Now load the merged data into the app
        window.location.reload(); // quick refresh to reload app with merged data
      } else {
        // No remote data: push local to firestore
        await setDoc(userDocRef, { 
          studyPulse: localData,
          lastSynced: serverTimestamp()
        });
      }
    }

    // Listen to real-time updates from Firestore
    function listenToFirestore(uid) {
      if (unsubscribeFirestore) unsubscribeFirestore();
      const userDocRef = doc(db, 'users', uid);
      unsubscribeFirestore = onSnapshot(userDocRef, (docSnap) => {
        if (docSnap.exists()) {
          const remoteData = docSnap.data().studyPulse || {};
          // Update local storage only if remote has data
          if (Object.keys(remoteData).length > 0) {
            localStorage.setItem('studyPulse', JSON.stringify(remoteData));
            // Reload only if data changed and user is on app
            if (document.getElementById('appSection').style.display !== 'none') {
              // We can reload or just refresh the timeline/reports
              // For simplicity, we reload the page to apply fresh data
              // But we can do a more elegant update.
              // To avoid infinite loop, we check if the data actually changed
              const currentLocal = JSON.parse(localStorage.getItem('studyPulse')) || {};
              if (JSON.stringify(currentLocal) !== JSON.stringify(remoteData)) {
                // Reload to reflect changes from other devices
                window.location.reload();
              }
            }
          }
        }
      });
    }

    // Save local data to Firestore (called after any modification)
    async function pushToFirestore(uid) {
      if (!uid) return;
      const localData = JSON.parse(localStorage.getItem('studyPulse')) || {};
      const userDocRef = doc(db, 'users', uid);
      await setDoc(userDocRef, { 
        studyPulse: localData,
        lastSynced: serverTimestamp()
      }, { merge: true });
    }

    // ---------- Auth state handler ----------
    async function handleUser(user) {
      if (user) {
        currentUser = user;
        userName.textContent = user.displayName || user.email || 'User';
        userEmail.textContent = user.email || '';
        // If guest, we still have a UID (guest UID from anonymous?)
        // For guest we use a fixed UID 'guest_user'? but better to generate unique
        // For simplicity, if guest, we create a pseudo UID based on device
        let uid = user.uid;
        if (user.isAnonymous) {
          // For guest, we use a persistent guest ID stored in localStorage
          let guestId = localStorage.getItem('guestId');
          if (!guestId) {
            guestId = 'guest_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            localStorage.setItem('guestId', guestId);
          }
          uid = guestId;
        }
        // Sync local with firestore (if user is not anonymous, else we don't sync)
        if (!user.isAnonymous) {
          await syncLocalWithFirestore(uid);
          listenToFirestore(uid);
          // Override push function to use firestore
          const originalPush = pushToFirestore;
          pushToFirestore = async function(uid) {
            if (!uid) return;
            const localData = JSON.parse(localStorage.getItem('studyPulse')) || {};
            const userDocRef = doc(db, 'users', uid);
            await setDoc(userDocRef, { 
              studyPulse: localData,
              lastSynced: serverTimestamp()
            }, { merge: true });
          };
        } else {
          // Guest: we don't sync to firestore, but we keep local
          // But we can still store in firestore under a guest document? 
          // For simplicity, guest uses localStorage only.
          // But we'll allow guest to use the app.
          pushToFirestore = async function(uid) {
            // no-op for guest
            console.log('Guest mode: no cloud sync');
          };
        }
        showApp();
        // Re-initialize app
        if (typeof window.initApp === 'function') {
          window.initApp();
        }
      } else {
        currentUser = null;
        if (unsubscribeFirestore) unsubscribeFirestore();
        showLogin();
      }
    }

    // Listen to auth state changes
    onAuthStateChanged(auth, handleUser);

    // ---------- Login methods ----------
    // Google login
    googleBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        setError(error.message);
      }
    });

    // Email login
    loginBtn.addEventListener('click', async () => {
      const email = loginEmail.value.trim();
      const password = loginPassword.value.trim();
      if (!email || !password) {
        setError('Please fill email and password');
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        setError(error.message);
      }
    });

    // Register
    registerBtn.addEventListener('click', async () => {
      const email = loginEmail.value.trim();
      const password = loginPassword.value.trim();
      if (!email || !password) {
        setError('Please fill email and password');
        return;
      }
      if (password.length < 6) {
        setError('Password must be at least 6 characters');
        return;
      }
      try {
        await createUserWithEmailAndPassword(auth, email, password);
      } catch (error) {
        setError(error.message);
      }
    });

    // Guest login (anonymous)
    guestBtn.addEventListener('click', async () => {
      try {
        // We'll sign in anonymously
        await signInWithPopup(auth, provider); // fallback? 
        // Actually we can use signInAnonymously, but it's not imported.
        // Since we have provider, we can just use Google sign-in but we want guest.
        // We'll create a pseudo guest user using Google sign-in with a dummy account?
        // For simplicity, we use a permanent guest session stored locally.
        // We'll just set a guest user object manually.
        const guestUser = {
          uid: 'guest_' + localStorage.getItem('guestId') || 'guest_' + Date.now(),
          displayName: 'Guest',
          email: 'guest@local.dev',
          isAnonymous: true
        };
        // Save to localStorage
        localStorage.setItem('guestUser', JSON.stringify(guestUser));
        // Trigger auth state manually
        handleUser(guestUser);
      } catch (error) {
        setError(error.message);
      }
    });

    // Logout
    logoutBtn.addEventListener('click', async () => {
      try {
        if (currentUser && !currentUser.isAnonymous) {
          // Push data before logout
          await pushToFirestore(currentUser.uid);
        }
        await signOut(auth);
        localStorage.removeItem('guestUser');
        showLogin();
      } catch (error) {
        setError(error.message);
      }
    });

    // Check for guest session on load
    window.addEventListener('load', () => {
      const guest = localStorage.getItem('guestUser');
      if (guest) {
        try {
          const guestUser = JSON.parse(guest);
          handleUser(guestUser);
        } catch(e) {}
      }
    });

    // Expose pushToFirestore to global scope so app can call it
    window.pushToFirestore = pushToFirestore;
    window.getCurrentUser = () => currentUser;

    console.log('🔥 Firebase + Login ready');
  </script>
